<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load in the background so the page never waits for them -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* =====================================================================
   SERVICE STORE — style.css
   Change the colors in :root to restyle the whole site.
   ===================================================================== */
:root{
  --bg:#09090b;
  --bg-2:#0f0f12;
  --panel:#151518;
  --panel-2:#1c1c20;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.11);
  --green:#13a35f;
  --green-2:#2fd182;
  --glow:rgba(47,209,130,.35);
  --red:#ff4d5e;
  --gold:#ffc24b;
  --text:#eef5f1;
  --muted:#8fa399;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Rubik",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:clip;
}
html[lang="ckb"] body, html[lang="ar"] body{font-family:"Noto Kufi Arabic","Rubik",sans-serif}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex-shrink:0}
.container{width:min(1240px,92%);margin-inline:auto}

/* Background grid + glow, fixed behind everything */
.bg-fx{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(19,163,95,.10), transparent 60%),
    radial-gradient(700px 500px at -10% 40%, rgba(19,163,95,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/44px 44px;
  mask-image:linear-gradient(to bottom, #000 0%, #000 60%, transparent 100%);
}

/* ---------------- Announcement bar ---------------- */
.announce{
  background:linear-gradient(90deg, var(--green), #0d7a47, var(--green));
  background-size:200% 100%;
  animation:slide 8s linear infinite;
  text-align:center;font-size:.82rem;font-weight:600;padding:7px 12px;color:#fff;
}
@keyframes slide{to{background-position:200% 0}}

/* ---------------- Header ---------------- */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(9,9,11,.86);
  backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.head{display:flex;align-items:center;gap:18px;padding:12px 0}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{width:50px;height:50px;clip-path:circle(48% at 50% 50%)}
.brand b{display:block;font-size:1.12rem;font-weight:800;line-height:1.2}
.brand small{display:block;color:var(--green-2);font-size:.75rem;font-weight:600;letter-spacing:.04em}

.search{position:relative;flex:1;max-width:520px;margin-inline:auto}
.search input{
  width:100%;padding:12px 46px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line-2);color:var(--text);font:inherit;font-size:.92rem;
  outline:none;transition:border-color .2s, box-shadow .2s;
}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(19,163,95,.15)}
.search > svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-results{
  position:absolute;top:calc(100% + 8px);inset-inline:0;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:none;z-index:50;
}
.search-results.open{display:block}
.sr-item{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:start}
.sr-item:hover{background:var(--panel-2)}
.sr-item .art{width:46px;height:46px;border-radius:10px;flex-shrink:0}
.sr-item .art .art-label, .c-item .art .art-label, .best-item .art .art-label{display:none}
.sr-item .art svg{width:16px;height:16px}
.sr-item div b{display:block;font-size:.92rem}
.sr-item div span{color:var(--green-2);font-size:.82rem;font-weight:600}
.sr-empty{padding:16px;color:var(--muted);font-size:.9rem;text-align:center}

.head-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang{display:flex;background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:4px}
.lang button{padding:6px 11px;border-radius:999px;color:var(--muted);font-size:.8rem;font-weight:600}
.lang button.active{background:var(--green);color:#fff}
.icon-btn{
  position:relative;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-2);
  transition:border-color .2s;
}
.icon-btn:hover{border-color:var(--green)}
.cart-count{
  position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:.7rem;font-weight:800;
  display:grid;place-items:center;font-family:"Rubik",sans-serif;
}
.cart-count:empty{display:none}
.cart-count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.4)}}
.search-toggle{display:none}

.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:8px 16px;border-radius:999px;color:var(--muted);font-size:.9rem;font-weight:600;
  transition:background .2s,color .2s;
}
.cats button:hover{color:var(--text);background:var(--panel)}
.cats button.active{color:#fff;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--green)}
.cats .dot{width:8px;height:8px;border-radius:50%}

/* ---------------- Hero ---------------- */
.hero{padding:28px 0 10px}
.hero-grid{display:grid;grid-template-columns:1fr 340px;gap:20px}
.slider{
  position:relative;border-radius:24px;overflow:hidden;min-height:400px;
  border:1px solid var(--line-2);box-shadow:var(--shadow);background:var(--panel);
}
.slide{
  position:absolute;inset:0;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;
  padding:44px;gap:24px;opacity:0;visibility:hidden;transition:opacity .7s, visibility .7s;
}
.slide.active{opacity:1;visibility:visible}
.slide::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:var(--slide-bg);opacity:.9;
}
.slide::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg, rgba(7,13,11,.92) 0%, rgba(7,13,11,.55) 55%, rgba(7,13,11,.1) 100%);
}
html[dir="rtl"] .slide::after{background:linear-gradient(270deg, rgba(7,13,11,.92) 0%, rgba(7,13,11,.55) 55%, rgba(7,13,11,.1) 100%)}
.kicker{
  display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;
  color:var(--green-2);background:rgba(47,209,130,.12);border:1px solid rgba(47,209,130,.3);
  padding:5px 12px;border-radius:999px;margin-bottom:16px;
}
.kicker svg{width:14px;height:14px}
.slide h1{font-size:clamp(1.7rem,3.4vw,2.8rem);line-height:1.2;font-weight:800;margin-bottom:12px}
.slide p{color:#c3d3cb;max-width:440px;margin-bottom:22px}
.slide .price-line{font-size:1.05rem;color:var(--muted);margin-bottom:22px}
.slide .price-line b{font-size:1.7rem;color:#fff;font-weight:800}
.slide-art{justify-self:center;width:min(280px,100%);aspect-ratio:1;border-radius:28px;transform:rotate(-6deg);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.slide.active .slide-art{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-3deg) translateY(-12px)}}
.slide-art .art-label{font-size:1.5rem}
.slide-art svg{width:72px;height:72px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

.dots{position:absolute;bottom:18px;inset-inline-end:44px;display:flex;gap:8px;z-index:2}
.dots button{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.3);transition:width .3s, background .3s}
.dots button.active{width:30px;background:var(--green-2)}

/* Logo side card */
.logo-card{
  position:relative;border-radius:24px;overflow:hidden;
  background:linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--line-2);padding:28px 22px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.logo-ring{position:relative;width:190px;height:190px;display:grid;place-items:center}
.logo-ring::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg, var(--green-2), transparent 30%, var(--green) 60%, transparent 85%, var(--green-2));
  animation:spin 6s linear infinite;
  mask:radial-gradient(circle, transparent 62%, #000 63%);
}
.logo-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;box-shadow:0 0 60px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-ring img{width:170px;height:170px;clip-path:circle(48% at 50% 50%);position:relative;z-index:1}
.logo-card h2{font-size:1.15rem;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stats div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px}
.stats b{display:block;font-size:1.25rem;color:var(--green-2);font-weight:800}
.stats span{font-size:.76rem;color:var(--muted)}

/* Trust strip */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.trust div{
  display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
}
.trust i{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:rgba(47,209,130,.12);color:var(--green-2);
}
.trust b{display:block;font-size:.92rem}
.trust span{font-size:.78rem;color:var(--muted)}

/* ---------------- Buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;font-weight:700;font-size:.95rem;
  background:var(--green);color:#fff;transition:transform .15s, background .2s, box-shadow .2s;
}
.btn:hover{background:var(--green-2);transform:translateY(-2px);box-shadow:0 10px 30px var(--glow)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.14);box-shadow:none}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

/* ---------------- Sections ---------------- */
section{padding:46px 0 10px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:1.55rem;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-head h2 .bar{width:6px;height:26px;border-radius:4px;background:var(--green-2)}
.sec-head .tools{display:flex;align-items:center;gap:8px}
.see-all{color:var(--green-2);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
.see-all svg{width:16px;height:16px}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-2)}
.arrow:hover{border-color:var(--green)}

/* Countdown */
.countdown{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.countdown .t{display:flex;gap:4px;direction:ltr}
.countdown .t span{
  min-width:38px;text-align:center;padding:6px 4px;border-radius:8px;
  background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.35);
  color:#fff;font-weight:800;font-family:"Rubik",sans-serif;
}
.flash h2 svg{color:var(--gold);width:24px;height:24px}

/* Horizontal row */
.row{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;
  overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
@media (min-width:1100px){.row{grid-auto-columns:calc((100% - 64px)/5)}}

/* ---------------- Product card ---------------- */
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;
  transition:transform .25s, border-color .25s, box-shadow .25s;cursor:pointer;text-align:start;
}
.card:hover{transform:translateY(-6px);border-color:rgba(47,209,130,.5);box-shadow:0 18px 40px rgba(0,0,0,.4), 0 0 0 1px rgba(47,209,130,.15)}
.card .art{aspect-ratio:4/3;border-radius:12px}
.card:hover .art-shine{transform:translateX(120%)}
.card-body{padding:12px 6px 4px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:.98rem;font-weight:700;line-height:1.35}
.card .sub{font-size:.78rem;color:var(--muted)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{display:flex;flex-direction:column;line-height:1.2}
.price small{font-size:.72rem;color:var(--muted)}
.price b{font-size:1.1rem;color:var(--green-2);font-weight:800}
.price b i{font-style:normal;font-size:.72rem;color:var(--muted);font-weight:500}
.price s{font-size:.75rem;color:var(--muted)}
.add-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(47,209,130,.12);color:var(--green-2);border:1px solid rgba(47,209,130,.3);
  transition:background .2s,color .2s;
}
.add-btn:hover{background:var(--green);color:#fff}

.badge{
  direction:ltr;
  position:absolute;top:18px;z-index:2;font-size:.7rem;font-weight:800;padding:4px 9px;border-radius:999px;
  font-family:"Rubik",sans-serif;letter-spacing:.03em;
}
.badge.plat{inset-inline-start:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15)}
.badge.off{inset-inline-end:18px;background:var(--red);color:#fff}

/* ---------------- Product art (generated, no images needed) ---------------- */
.art{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--art);color:#fff;isolation:isolate;
}
.art::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 80% 15%, rgba(255,255,255,.28), transparent 35%),
    radial-gradient(circle at 10% 110%, rgba(0,0,0,.45), transparent 50%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px);
}
.art svg{width:42px;height:42px;opacity:.95;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.art-label{font-family:"Rubik",sans-serif;font-weight:800;font-size:1rem;letter-spacing:.06em;text-align:center;padding-inline:12px;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.35);direction:ltr}
.art-shine{position:absolute;inset:0;background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);transform:translateX(-120%);transition:transform .8s}

/* ---------------- Best sellers ---------------- */
.best{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.best-item{
  display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;cursor:pointer;transition:border-color .2s;text-align:start;width:100%;
}
.best-item:hover{border-color:rgba(47,209,130,.5)}
.rank{font-family:"Rubik",sans-serif;font-size:1.8rem;font-weight:800;width:36px;text-align:center;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.25));-webkit-background-clip:text;background-clip:text;color:transparent}
.best-item .art{width:64px;height:64px;border-radius:12px;flex-shrink:0}
.best-item .art svg{width:24px;height:24px}
.best-item .art .art-label{font-size:.6rem}
.best-info{flex:1;min-width:0}
.best-info b{display:block;font-size:.95rem}
.best-info span{font-size:.78rem;color:var(--muted)}
.best-item .price{text-align:end}

/* ---------------- Catalog ---------------- */
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.select{
  background:var(--panel);border:1px solid var(--line-2);color:var(--text);
  border-radius:999px;padding:9px 14px;font:inherit;font-size:.88rem;outline:none;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips button{padding:7px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);font-size:.88rem}
.chips button.active{border-color:var(--green);color:var(--green-2);background:rgba(47,209,130,.08)}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}

/* ---------------- FAQ ---------------- */
.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px}
.faq details[open]{border-color:rgba(47,209,130,.4)}
.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--green-2);font-size:1.3rem;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--muted);margin-top:10px;font-size:.93rem}

/* Follow banner */
.follow{
  margin-top:46px;border-radius:24px;padding:34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:linear-gradient(120deg, rgba(19,163,95,.25), rgba(19,163,95,.05)), var(--panel);
  border:1px solid rgba(47,209,130,.3);
}
.follow h2{font-size:1.4rem;font-weight:800}
.follow p{color:var(--muted)}
.socials{display:flex;gap:10px;flex-wrap:wrap}
.socials a{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;
  background:rgba(0,0,0,.3);border:1px solid var(--line-2);font-weight:600;font-size:.88rem;
}
.socials a:hover{border-color:var(--green)}

/* ---------------- Footer ---------------- */
footer{margin-top:56px;border-top:1px solid var(--line);background:var(--bg-2)}
.foot{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:30px;padding:44px 0}
.foot h4{font-size:.95rem;margin-bottom:12px}
.foot p, .foot li{color:var(--muted);font-size:.88rem}
.foot ul{list-style:none;display:grid;gap:8px}
.foot a:hover{color:var(--green-2)}
.pay{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pay span{font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line-2);font-family:"Rubik",sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}
.copy{border-top:1px solid var(--line);padding:18px 0;text-align:center;color:var(--muted);font-size:.82rem}

/* ---------------- Overlay / Modal / Drawer ---------------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:60;opacity:0;visibility:hidden;transition:.3s}
.overlay.open{opacity:1;visibility:visible}

.modal{
  position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(820px,94vw);max-height:90vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transition:.3s;
}
.modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.modal-inner{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;padding:24px}
.modal .art{aspect-ratio:1;border-radius:18px}
.modal .art svg{width:70px;height:70px}
.modal .art .art-label{font-size:1.5rem}
.close{position:absolute;top:14px;inset-inline-end:14px;z-index:3}
.m-plat{display:inline-block;font-size:.72rem;font-weight:800;color:var(--green-2);margin-bottom:6px;font-family:"Rubik",sans-serif}
.modal h3{font-size:1.45rem;line-height:1.3;margin-bottom:8px;padding-inline-end:40px}
.modal .desc{color:var(--muted);font-size:.93rem;margin-bottom:18px}
.label{font-size:.82rem;color:var(--muted);margin-bottom:8px;display:block}
.options{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:18px}
.opt{
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:10px;text-align:start;
  background:var(--bg-2);transition:border-color .2s, background .2s;
}
.opt b{display:block;font-size:.88rem}
.opt span{font-size:.82rem;color:var(--green-2);font-weight:700}
.opt s{font-size:.72rem;color:var(--muted);margin-inline-start:6px;display:inline-block}
.opt.active{border-color:var(--green-2);background:rgba(47,209,130,.1)}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:999px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.stepper button:hover{background:var(--panel-2)}
.stepper button svg{width:16px;height:16px}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-family:"Rubik",sans-serif}
.m-total{font-size:1.5rem;font-weight:800;color:#fff}
.m-total i{font-style:normal;font-size:.85rem;color:var(--muted);font-weight:500}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:70;width:min(420px,100vw);
  background:var(--panel);border-inline-start:1px solid var(--line-2);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open, html[dir="rtl"] .drawer.open{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.d-head h3{font-size:1.15rem}
.d-body{flex:1;overflow:auto;padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.c-item{display:flex;gap:12px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px}
.c-item .art{width:56px;height:56px;border-radius:10px;flex-shrink:0}
.c-item .art svg{width:22px;height:22px}
.c-item .art .art-label{font-size:.5rem}
.c-info{flex:1;min-width:0}
.c-info b{display:block;font-size:.88rem;line-height:1.3}
.c-info span{font-size:.76rem;color:var(--muted)}
.c-info .p{display:block;color:var(--green-2);font-weight:700;font-size:.85rem}
.c-item .stepper{padding:2px}
.c-item .stepper button{width:26px;height:26px}
.d-empty{text-align:center;color:var(--muted);padding:60px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.d-empty svg{width:48px;height:48px;opacity:.4}
.d-foot{border-top:1px solid var(--line);padding:16px 20px;display:grid;gap:12px}
.d-foot textarea{
  width:100%;resize:none;height:62px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);
  color:var(--text);font:inherit;font-size:.88rem;padding:10px 12px;outline:none;
}
.d-foot textarea:focus{border-color:var(--green)}
.d-total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.15rem}
.d-total b{color:var(--green-2)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);z-index:90;
  background:var(--green);color:#fff;font-weight:700;padding:12px 20px;border-radius:999px;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px var(--glow);
  opacity:0;visibility:hidden;transition:.3s;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s, transform .7s}
.reveal.in{opacity:1;transform:none}

/* Floating WhatsApp button */
.wa-float{
  position:fixed;bottom:22px;inset-inline-start:22px;z-index:35;width:56px;height:56px;border-radius:50%;
  background:var(--green);display:grid;place-items:center;box-shadow:0 10px 30px var(--glow);
  animation:pulse 2.4s infinite;
}
.wa-float svg{width:26px;height:26px;color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,209,130,.5)}70%{box-shadow:0 0 0 16px rgba(47,209,130,0)}100%{box-shadow:0 0 0 0 rgba(47,209,130,0)}}

/* ---------------- Responsive ---------------- */
@media (max-width:1000px){
  .hero-grid{grid-template-columns:1fr}
  .logo-card{flex-direction:row;text-align:start;padding:18px}
  .logo-ring{width:110px;height:110px;flex-shrink:0}
  .logo-ring img{width:96px;height:96px}
  .logo-card .stats{display:none}
  .trust{grid-template-columns:repeat(2,1fr)}
  .best{grid-template-columns:1fr}

}

  .head{flex-wrap:wrap;row-gap:12px}
  .search{order:5;flex-basis:100%;max-width:none}
  .desk-only{display:none!important}
  .cats{display:none}
  .brand small{display:none}
  .brand b{font-size:1rem}
  .brand img{width:42px;height:42px}
  .head{gap:10px}
  .head-actions{margin-inline-start:auto;gap:6px}
  .lang button{padding:5px 8px;font-size:.72rem}
  .icon-btn{width:40px;height:40px}
  .slider{min-height:520px}
  .announce{font-size:.72rem;padding:6px 10px}
  .slide{grid-template-columns:1fr;padding:26px 22px 54px;text-align:center;align-content:center}
  .slide p{margin-inline:auto}
  .slide .btn-row{justify-content:center}
  .slide-art{width:120px;order:-1;transform:none}
  .slide.active .slide-art{animation:none}
  .slide-art svg{width:40px;height:40px}
  .slide-art .art-label{font-size:.7rem}
  .slide::after{background:linear-gradient(0deg, rgba(7,13,11,.95) 40%, rgba(7,13,11,.4) 100%) !important}
  .dots{inset-inline-end:auto;left:50%;transform:translateX(-50%)}
  .trust{grid-template-columns:1fr 1fr;gap:10px}
  .trust div{flex-direction:column;text-align:center;padding:14px 10px}
  .row{grid-auto-columns:62%}

  .card{padding:8px}
  .card h3{font-size:.88rem}
  .modal{top:auto;bottom:0;left:0;right:0;transform:translateY(100%);width:100%;border-radius:24px 24px 0 0;max-height:88vh}
  .modal.open{transform:none}
  .modal-inner{grid-template-columns:1fr;padding:18px}
  .modal .art{aspect-ratio:16/9}
  .foot{grid-template-columns:1fr}
  .follow{padding:24px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* =====================================================================

.menu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}

.m-nav{display:flex;flex-direction:column;gap:4px}
.m-nav button{

.promo{

}
.promo-top{display:flex;gap:14px;align-items:center}

.prefs{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:16px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pref > span{font-size:.75rem;font-weight:700;letter-spacing:.12em;color:var(--muted);font-family:"Rubik",sans-serif}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:999px;padding:4px}

.seg button.active{background:#fff;color:#111}
.flag-ku{width:18px;height:12px;border-radius:2px;flex-shrink:0;
  background:radial-gradient(circle at 50% 50%, #f5c400 2.5px, transparent 3px), linear-gradient(#ed2024 33.3%, #fff 33.3% 66.6%, #278e43 66.6%)}
.btn.white{background:#fff;color:#111}
.btn.white:hover{background:#e9e9e9;box-shadow:none}

/* Spotlight hero */
.spot{
  border-radius:28px;background:var(--panel);border:1px solid var(--line-2);padding:22px;
  display:flex;flex-direction:column;gap:16px;min-width:0;
}
.spot-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spot-head h2{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
html[lang="ckb"] .spot-head h2, html[lang="ar"] .spot-head h2{letter-spacing:0;font-size:1.1rem}
.spot-head h2 svg{color:var(--green-2);width:22px;height:22px}
.spot-head .arrows{display:flex;gap:8px}
.spot-head .arrow{width:44px;height:44px;border-radius:12px}

.spot-card{
  position:relative;border-radius:22px;overflow:hidden;min-height:430px;isolation:isolate;
  background:var(--art);border:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:flex-end;
  animation:fadeIn .5s ease;
}
@keyframes fadeIn{from{opacity:.2;transform:scale(.99)}to{opacity:1;transform:none}}
.spot-card::before{
  content:"";position:absolute;inset:0;z-index:-1;

    radial-gradient(circle at 80% 10%, rgba(255,255,255,.25), transparent 40%),

}

  content:"";position:absolute;inset:0;z-index:-1;

}
.spot-mark{
  position:absolute;top:58px;inset-inline:0;z-index:-1;text-align:center;direction:ltr;

}

  position:absolute;top:18px;inset-inline-start:18px;display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);

}
.spot-plat svg{width:18px;height:18px;color:var(--green-2)}
.spot-body{padding:24px;display:flex;flex-direction:column;gap:12px}
.spot-body h1{font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.15;font-weight:800}
.spot-body p{color:#b9b9bf;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:620px}
.spot-opts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.spot-opts::-webkit-scrollbar{display:none}
.spot-opts button{

.spot-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2);padding-top:16px;margin-top:4px}

.spot-foot .price b i{font-size:.9rem}
.spot-btns{display:flex;gap:10px}
.spot-btns .cart-sq{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.4);border:1px solid var(--line-2)}

/* =====================================================================
   Animated category backgrounds
   ===================================================================== */
#theme-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.theme-layer{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.theme-layer.in{opacity:1}
.theme-glow{
  position:absolute;inset:-10%;
  background:
    radial-gradient(700px 420px at 20% 10%, color-mix(in srgb, var(--tc) 40%, transparent), transparent 70%),
    radial-gradient(600px 420px at 90% 70%, color-mix(in srgb, var(--tc) 20%, transparent), transparent 70%);
  animation:glowMove 16s ease-in-out infinite alternate;
}
@keyframes glowMove{to{transform:translate(4%, 3%) scale(1.08)}}
.theme-emblem{
  position:absolute;top:50%;left:50%;width:min(70vw,620px);aspect-ratio:1;
  transform:translate(-50%,-50%);display:grid;place-items:center;
  color:var(--tc);opacity:.09;animation:emblem 40s linear infinite;
}
.theme-emblem::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px dashed currentColor;opacity:.8;
}
.theme-emblem svg{width:55%;height:55%;stroke-width:1.2;animation:emblemPulse 6s ease-in-out infinite}
@keyframes emblem{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes emblemPulse{50%{transform:scale(1.08) rotate(-360deg)}}
.fl{
  position:absolute;width:var(--s);height:var(--s);color:var(--tc);opacity:var(--o);
  filter:blur(var(--b)) drop-shadow(0 0 12px color-mix(in srgb, var(--tc) 60%, transparent));
  animation:drift var(--d) ease-in-out var(--dl) infinite alternate;
  will-change:transform;
}
.fl svg{width:100%;height:100%;stroke-width:1.5}
@keyframes drift{
  0%  {transform:translate(0,0) rotate(0deg) scale(1)}
  50% {transform:translate(calc(var(--dx) * .5), var(--dy)) rotate(calc(var(--r) * .5)) scale(1.06)}
  100%{transform:translate(var(--dx), calc(var(--dy) * .3)) rotate(var(--r)) scale(.96)}
}
/* let the background show through the main page */
.hero, section{position:relative}
@media (prefers-reduced-motion:reduce){ .fl,.theme-emblem,.theme-glow{animation:none!important} }


/* Category banner */
.cat-hero{
  position:relative;overflow:hidden;isolation:isolate;border-radius:24px;margin-bottom:18px;
  min-height:220px;display:flex;align-items:flex-end;padding:26px;
  border:1px solid color-mix(in srgb, var(--tc) 55%, transparent);
  background:
    radial-gradient(500px 260px at 85% 30%, color-mix(in srgb, var(--tc) 55%, transparent), transparent 70%),
    radial-gradient(400px 240px at 10% 110%, color-mix(in srgb, var(--tc) 35%, transparent), transparent 70%),
    linear-gradient(135deg, #0d0d10, color-mix(in srgb, var(--tc) 18%, #0d0d10));
  box-shadow:0 20px 60px color-mix(in srgb, var(--tc) 25%, transparent);
}
html[dir="rtl"] .cat-hero{background:
    radial-gradient(500px 260px at 15% 30%, color-mix(in srgb, var(--tc) 55%, transparent), transparent 70%),
    radial-gradient(400px 240px at 90% 110%, color-mix(in srgb, var(--tc) 35%, transparent), transparent 70%),
    linear-gradient(225deg, #0d0d10, color-mix(in srgb, var(--tc) 18%, #0d0d10))}
.cat-hero.pop{animation:heroPop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes heroPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.ch-scene{position:absolute;inset:0;z-index:-1}
.ch-scene .fl{filter:blur(var(--b)) drop-shadow(0 0 14px var(--tc))}
.cat-hero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(0deg, rgba(9,9,11,.85) 0%, rgba(9,9,11,.2) 55%, transparent 100%);
}
.ch-orb{
  position:absolute;top:50%;inset-inline-end:7%;transform:translateY(-50%);z-index:-1;
  width:150px;height:150px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle, color-mix(in srgb, var(--tc) 80%, #fff 10%), color-mix(in srgb, var(--tc) 40%, transparent) 60%, transparent 72%);
  animation:orbFloat 5s ease-in-out infinite;
}
.ch-orb > svg{width:64px;height:64px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5))}
.ch-ring{position:absolute;inset:-14px;border-radius:50%;border:2px dashed color-mix(in srgb, var(--tc) 70%, #fff);opacity:.6;animation:spin 14s linear infinite}
.ch-ring.r2{inset:-34px;border-style:solid;border-width:1px;opacity:.3;animation-duration:22s;animation-direction:reverse}
@keyframes orbFloat{50%{transform:translateY(calc(-50% - 12px))}}
.ch-text{position:relative;max-width:60%}
.ch-count{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:999px;
  background:color-mix(in srgb, var(--tc) 30%, rgba(0,0,0,.4));border:1px solid color-mix(in srgb, var(--tc) 60%, transparent);margin-bottom:10px}
.ch-text h2{font-size:clamp(1.7rem,3.5vw,2.6rem);font-weight:800;line-height:1.15;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.ch-text p{color:#d4d4da;margin-top:6px}
@media (max-width:720px){
  .cat-hero{min-height:190px;padding:20px}
  .ch-orb{width:96px;height:96px;top:34%}
  .ch-orb > svg{width:42px;height:42px}
  .ch-text{max-width:100%}
}
@media (prefers-reduced-motion:reduce){ .ch-orb,.ch-ring{animation:none!important} }
#store{scroll-margin-top:140px}

/* Falling icon rain */
.rain{
  position:absolute;top:0;width:0;height:0;
  animation:fall var(--d) linear var(--dl) infinite;
  will-change:transform;
}
.rain > i{
  display:block;width:var(--s);height:var(--s);margin-inline-start:calc(var(--s) / -2);
  color:color-mix(in srgb, var(--tc) 78%, #fff);opacity:var(--o);
  filter:blur(var(--b)) drop-shadow(0 0 10px var(--tc));
  animation:sway var(--sw) ease-in-out var(--dl) infinite alternate;
}
.rain > i svg{width:100%;height:100%;stroke-width:1.6}
@keyframes fall{
  0%  {transform:translateY(-12vh);opacity:0}
  8%  {opacity:1}
  88% {opacity:1}
  100%{transform:translateY(112vh);opacity:0}
}
@keyframes sway{
  from{transform:translateX(calc(var(--x) * -1)) rotate(calc(var(--r) * -1))}
  to  {transform:translateX(var(--x)) rotate(var(--r))}
}
@media (prefers-reduced-motion:reduce){ .rain{animation:none!important;top:30%} .rain > i{animation:none!important} }

/* =====================================================================
   Fortnite live item shop
   ===================================================================== */
.art-img{background:var(--art)}
.art-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .5s}
.card:hover .art-img img{transform:scale(1.06)}
.art-img::before{display:none}
.card .art-img{aspect-ratio:1}
.fs-head{align-items:flex-end}
.fs-sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.fs-reset{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);
  background:var(--panel);border:1px solid rgba(157,77,255,.4);border-radius:999px;padding:8px 14px}
.fs-reset svg{width:16px;height:16px;color:#b98aff}
.fs-reset b{color:#fff;font-family:"Rubik",sans-serif}
.fs-chips small{opacity:.6;margin-inline-start:4px;font-family:"Rubik",sans-serif}
.fs-chips button.active{border-color:#9d4dff;color:#c9a3ff;background:rgba(157,77,255,.12)}
.card .vb{color:#c9a3ff;font-weight:700;font-family:"Rubik",sans-serif}
.card .leaves{color:#ffb86b;font-size:.75rem}
.fs-msg{display:flex;flex-direction:column;align-items:center;gap:12px}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(157,77,255,.25);border-top-color:#9d4dff;animation:spin 1s linear infinite}
.modal .art-img{aspect-ratio:1}
.c-item .art-img, .sr-item .art-img, .thumbs .art-img{background:var(--art)}
@media (max-width:720px){ .fs-reset{width:100%;justify-content:center} }

.art .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;z-index:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.art .photo ~ .art-shine{z-index:2}
.art.has-photo > svg{display:none}
.art.has-photo .photo{padding:10% 18% 26%}
.art.has-photo .art-label{position:absolute;bottom:7%;z-index:2}

/* spotlight with a real picture */
.spot-img{position:absolute;top:0;left:0;width:100%;height:68%;object-fit:cover;object-position:center 42%;z-index:-1;
  -webkit-mask-image:linear-gradient(#000 60%, transparent);mask-image:linear-gradient(#000 60%, transparent)}
.spot-card.has-img::before{display:none}
.spot-card.has-img .spot-body h1, .spot-card.has-img .spot-body p{text-shadow:0 2px 14px rgba(0,0,0,.85)}
.spot-card.has-img::after{background:linear-gradient(180deg, rgba(9,9,11,0) 25%, rgba(9,9,11,.7) 50%, rgba(9,9,11,.97) 72%)}
@media (max-width:720px){ .spot-card.has-img{min-height:540px} .spot-img{height:58%} }
.spot-card.has-img .spot-plat{display:none}
.spot-img{-webkit-mask-image:linear-gradient(#000 50%, transparent 85%);mask-image:linear-gradient(#000 50%, transparent 85%)}

/* highlight like "4K Premium" */
.note-pill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;width:max-content;
  font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px;font-family:"Rubik",sans-serif;
  color:#ffd76a;background:rgba(255,194,75,.12);border:1px solid rgba(255,194,75,.45);margin:2px 0}
.note-pill svg{width:12px;height:12px;fill:#ffd76a;stroke:#ffd76a}
.modal .note-pill{margin-bottom:10px;font-size:.85rem}
.spot-body .note-pill{font-size:.85rem;background:rgba(0,0,0,.45)}
html[lang="ckb"] .note-pill, html[lang="ar"] .note-pill{font-family:"Noto Kufi Arabic","Rubik",sans-serif;font-weight:700;letter-spacing:0}

/* Kurdish & Arabic text always uses the Kurdish/Arabic font (no letter spacing, so letters stay joined) */
html[lang="ckb"] :is(.m-plat,.pref > span,.ch-count,.demo-bar,.kicker,.badge,.spot-plat),
html[lang="ar"]  :is(.m-plat,.pref > span,.ch-count,.demo-bar,.kicker,.badge,.spot-plat){
  font-family:"Noto Kufi Arabic","Rubik",sans-serif;letter-spacing:0}
.modal .desc{white-space:pre-line}
.modal .art-img img{object-position:center}

/* About us */
.about-btn{gap:10px}
.about-modal{width:min(520px,94vw)}
.about-inner{padding:30px 24px 26px;text-align:center}
.about-logo{width:96px;height:96px;margin:0 auto 14px;clip-path:circle(48%)}
.about-inner h3{font-size:1.4rem;margin-bottom:10px}
.about-inner > p{color:var(--muted);line-height:1.8}
.about-list{list-style:none;display:grid;gap:10px;margin-top:20px;text-align:start}
.about-list li{display:flex;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.92rem}
.about-list svg{color:var(--green-2);flex-shrink:0}
@media (max-width:720px){ .about-modal{width:100%} }

</style>

<script>
/* =====================================================================
   SERVICE STORE — reviews.js
   Saves and loads reviews.
   - DEMO mode (SETTINGS.firebase = null): saved only in this browser.
   - LIVE mode (Firebase config pasted in data.js): saved online, everyone sees them,
     and people must sign in with Google or an email link before posting.
   ===================================================================== */
const ReviewStore = (() => {
  const cfg = SETTINGS.firebase;
  const live = !!(cfg && cfg.apiKey);
  let auth = null, db = null, user = null;
  const listeners = [];
  const emit = () => listeners.forEach(f => f(user));

  const local = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
    del(k){ try { localStorage.removeItem(k); } catch(e){} },
  };

  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  let initPromise = null;
  function init(){ return initPromise || (initPromise = _init()); }
  async function _init(){
    if(!live){ user = local.get("demo_user"); emit(); return; }
    const base = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
    await loadScript(base + "firebase-app-compat.js");
    await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
    firebase.initializeApp(cfg);
    auth = firebase.auth();
    db = firebase.firestore();

    // Coming back from the email sign-in link
    if(auth.isSignInWithEmailLink(location.href)){
      const email = local.get("emailForSignIn");
      if(email){
        try { await auth.signInWithEmailLink(email, location.href); local.del("emailForSignIn"); }
        catch(e){ console.error(e); }
      }
      history.replaceState(null, "", location.pathname);
    }
    await new Promise(res => auth.onAuthStateChanged(u => {
      user = u ? { uid: u.uid, email: u.email, name: u.displayName || "" } : null;
      emit(); res();
    }));
  }

  async function list(){
    if(!live) return local.get("demo_reviews") || [];
    const snap = await db.collection("reviews").orderBy("createdAt", "desc").limit(500).get();
    return snap.docs.map(d => {
      const r = d.data();
      return { uid: d.id, name: r.name, rating: r.rating, text: r.text,
               createdAt: r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : Date.now() };
    });
  }

  // One review per person: the review is stored under the person's id, so posting again updates it.
  async function save({ rating, text, name }){
    if(!user) throw new Error("not signed in");
    const review = { uid: user.uid, name: name.slice(0, 40), rating, text: text.slice(0, 1000) };
    if(!live){
      const all = (local.get("demo_reviews") || []).filter(r => r.uid !== user.uid);
      all.unshift({ ...review, createdAt: Date.now() });
      local.set("demo_reviews", all);
      return;
    }
    await db.collection("reviews").doc(user.uid).set({
      ...review, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }

  async function signInGoogle(){
    if(!live) return "demo";
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    return "ok";
  }

  // Live: emails a sign-in link. Demo: signs in straight away (no email is sent).
  async function signInEmail(email){
    if(!live){
      user = { uid: "demo-" + email.toLowerCase(), email, name: email.split("@")[0] };
      local.set("demo_user", user); emit();
      return "signed";
    }
    await auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp: true });
    local.set("emailForSignIn", email);
    return "sent";
  }

  async function signOut(){
    if(!live){ local.del("demo_user"); user = null; emit(); return; }
    await auth.signOut();
  }

  function stats(list){
    const dist = [0,0,0,0,0,0];
    list.forEach(r => dist[r.rating]++);
    const count = list.length;
    const avg = count ? list.reduce((s,r) => s + r.rating, 0) / count : 0;
    return { count, avg, dist };
  }

  return { live, init, list, save, signInGoogle, signInEmail, signOut, stats,
           onAuth: f => listeners.push(f), get user(){ return user; } };
})();

</script>
<script>
/* =====================================================================
   SERVICE STORE — catalog.js
   Loads the products/sections you edit in admin.html.
   - Firebase connected: saved online, every visitor sees your changes.
   - Not connected (DEMO): saved only in this browser, for trying it out.
   If nothing was saved yet, the store uses data.js as it is.
   ===================================================================== */
const Catalog = (() => {
  const live = !!(SETTINGS.firebase && SETTINGS.firebase.apiKey);
  const LS = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
    del(k){ try { localStorage.removeItem(k); } catch(e){} },
  };
  const copy = o => JSON.parse(JSON.stringify(o));
  const snapshot = () => ({
    categories: Object.entries(CATEGORIES).map(([key, c]) => ({ key, ...copy(c) })),
    products: copy(PRODUCTS),
    hero: [...SETTINGS.heroProducts],
  });
  const ORIGINAL = snapshot();          // data.js exactly as written

  function apply(cat, images = {}){
    const cats = cat.categories.filter(c => c.key);
    if(!cats.some(c => c.key === "all")) cats.unshift(ORIGINAL.categories.find(c => c.key === "all"));
    cats.sort((a, b) => (a.key === "all" ? -1 : b.key === "all" ? 1 : 0));
    Object.keys(CATEGORIES).forEach(k => delete CATEGORIES[k]);
    cats.forEach(({ key, ...rest }) => CATEGORIES[key] = rest);
    PRODUCTS.length = 0;
    cat.products.forEach(p => {
      p = copy(p);
      if(p.image && p.image.startsWith("db:")) p.image = images[p.image.slice(3)] || "";
      if(!p.image) delete p.image;
      PRODUCTS.push(p);
    });
    SETTINGS.heroProducts = cat.hero || [];
  }

  async function fetchSaved(){
    if(!live){
      const c = LS.get("demo_catalog");
      return c ? { cat: c, images: LS.get("demo_images") || {} } : null;
    }
    await ReviewStore.init();
    const db = firebase.firestore();
    const doc = await db.collection("catalog").doc("main").get();
    if(!doc.exists) return null;
    const images = {};
    (await db.collection("images").get()).forEach(d => images[d.id] = d.data().data);
    return { cat: JSON.parse(doc.data().json), images };
  }

  async function load(){
    const saved = await fetchSaved();
    if(!saved) return false;
    apply(saved.cat, saved.images);
    return true;
  }

  /* newImages: { id: "data:image/jpeg;base64,..." }, removed: [id, ...] */
  async function save(cat, newImages, removed){
    if(!live){
      const all = Object.assign(LS.get("demo_images") || {}, newImages);
      removed.forEach(id => delete all[id]);
      if(!LS.set("demo_images", all) || !LS.set("demo_catalog", cat)) throw new Error("This browser's storage is full.");
      return;
    }
    const db = firebase.firestore();
    for(const [id, data] of Object.entries(newImages)) await db.collection("images").doc(id).set({ data });
    for(const id of removed) await db.collection("images").doc(id).delete();
    await db.collection("catalog").doc("main").set({ json: JSON.stringify(cat), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  async function reset(){
    if(!live){ LS.del("demo_catalog"); LS.del("demo_images"); return; }
    const db = firebase.firestore();
    (await db.collection("images").get()).forEach(d => d.ref.delete());
    await db.collection("catalog").doc("main").delete();
  }

  return { live, load, fetchSaved, save, reset, original: () => copy(ORIGINAL) };
})();

</script>
<script>
/* =====================================================================
   SERVICE STORE — fnshop.js
   Live Fortnite Item Shop, loaded every day from https://fortnite-api.com/v2/shop
   - Shows today's bundles and items with their official pictures
   - Prices in IQD come from SETTINGS.fortniteShop.tiers (data.js)
   - Each item counts down to when it leaves; when items leave or the shop
     resets (00:00 UTC), the new shop is loaded automatically
   ===================================================================== */
const FN_SHOP = new Map();             // id → product (used by cart, search and popups)

const FnShop = (() => {
  const API = "https://fortnite-api.com/v2/shop";
  const CACHE = "fnShopCache";
  const KINDS = ["bundle","outfit","emote","pickaxe","glider","backpack"];
  const RARITY = {
    common:"#6b6b6b,#3d3d3d", uncommon:"#4fa83d,#1f5a17", rare:"#3d9be0,#173f78", epic:"#b057e6,#4b1a72",
    legendary:"#e9853a,#7a3510", mythic:"#e8c74b,#7a5f10", exotic:"#6fe0ef,#1b6b78",
  };
  const SERIES = [   // [word found in the series name, colors]
    ["marvel","#d4383b,#5a0f12"], ["dc","#3f5bd6,#151f5c"], ["icon","#1fc0c9,#0b4e57"], ["creatorcollab","#1fc0c9,#0b4e57"],
    ["gaming","#7a4fe0,#24124f"], ["star","#3a5068,#0e1620"], ["shadow","#5e5e6e,#18181f"], ["slurp","#22d0c6,#0a5e6a"],
    ["frozen","#9fd5ff,#3266a8"], ["lava","#ff7a2e,#6a1a10"], ["dark","#c63cd8,#3a0a4a"], ["lego","#f2c200,#8a5a00"],
  ];

  let state = "idle", kind = "all", timer = null;

  const now = () => Date.now();
  const tierPrice = vb => {
    for(const t of SETTINGS.fortniteShop.tiers) if(vb <= t.max) return t.price;
    return null;                                     // too expensive → not shown
  };
  const colorsFor = (rarity, series) => {
    const s = (series || "").toLowerCase().replace(/\s/g, "");
    const hit = SERIES.find(([w]) => s.includes(w));
    const c = (hit ? hit[1] : RARITY[rarity] || RARITY.epic).split(",");
    return `radial-gradient(circle at 50% 35%, ${c[0]}, ${c[1]} 75%)`;
  };

  /* Turn one shop entry from the API into a product for the site */
  function toProduct(e){
    if(SETTINGS.fortniteShop.giftableOnly && e.giftable === false) return null;
    const vb = e.finalPrice;
    if(!vb) return null;
    const price = tierPrice(vb);
    if(price == null) return null;
    const br = e.brItems || [];
    if(!br.length && !e.bundle) return null;         // skip Jam Tracks, cars, instruments
    const first = br[0] || {};
    const rawKind = e.bundle ? "bundle" : ((first.type && first.type.value) || "other");
    const k = KINDS.includes(rawKind) ? rawKind : "other";
    const name = (e.bundle && e.bundle.name) || (br.length > 1 ? br.map(b => b.name).join(" + ") : first.name);
    const render = e.newDisplayAsset && e.newDisplayAsset.renderImages && e.newDisplayAsset.renderImages[0];
    const img = (render && render.image) || (e.bundle && e.bundle.image) ||
                (first.images && (first.images.featured || first.images.icon || first.images.smallIcon));
    if(!name || !img) return null;
    const rarity = (first.rarity && first.rarity.value || "").toLowerCase();
    const series = first.series && (first.series.backendValue || first.series.value);
    const typeName = e.bundle ? "Bundle" : ((first.type && first.type.displayValue) || "Item");
    const rarityName = (first.series && first.series.value) || (first.rarity && first.rarity.displayValue) || "";
    const info = [typeName, rarityName, br.length > 1 ? `${br.length} items` : ""].filter(Boolean).join(" · ");
    return {
      id: "fn-shop-" + e.offerId, shop: true, cat: "fortnite", platform: typeName.toUpperCase(),
      art: "fortnite", icon: "shirt", label: name, image: img, bg: colorsFor(rarity, series),
      kind: k, vbucks: vb, outDate: Date.parse(e.outDate) || 0, sold: 0,
      name: { en: name, ckb: name, ar: name },
      desc: { en: `${info}. ${TEXT.en.fs_note}`, ckb: `${info}. ${TEXT.ckb.fs_note}`, ar: `${info}. ${TEXT.ar.fs_note}` },
      options: [{ label: `${vb} V-Bucks`, price }],
    };
  }

  function fill(list){
    FN_SHOP.clear();
    list.filter(p => p.outDate > now()).forEach(p => FN_SHOP.set(p.id, p));
  }

  /* Show the last saved shop straight away (also keeps cart items working before loading) */
  if(SETTINGS.fortniteShop.enabled){
    try { const c = JSON.parse(localStorage.getItem(CACHE)); if(c && c.items) fill(c.items); } catch(e){}
  }

  const list = () => SETTINGS.fortniteShop.enabled ? [...FN_SHOP.values()].filter(p => p.outDate > now()) : [];

  async function load(){
    state = FN_SHOP.size ? "ok" : "loading"; render();
    try {
      const res = await fetch(API);
      if(!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      const entries = (json.data && json.data.entries) || [];
      const seen = new Set(), items = [];
      entries.forEach(e => { const p = toProduct(e); if(p && !seen.has(p.id)){ seen.add(p.id); items.push(p); } });
      fill(items);
      try { localStorage.setItem(CACHE, JSON.stringify({ at: now(), items })); } catch(e){}
      state = "ok";
    } catch(err){
      console.error("Fortnite shop:", err);
      state = FN_SHOP.size ? "ok" : "error";
    }
    render();
    schedule();
    if(typeof catalogCat !== "undefined" && catalogCat === "fortnite"){ renderCatalog(); renderCatHero(); }
  }

  /* Next 00:00 UTC (the daily shop reset) */
  function nextReset(){
    const d = new Date(); d.setUTCHours(24, 0, 0, 0); return d.getTime();
  }

  /* Reload when the first item leaves or the shop resets, whichever is sooner */
  function schedule(){
    clearTimeout(timer);
    const soonest = Math.min(nextReset(), ...list().map(p => p.outDate));
    const wait = Math.max(60e3, soonest - now() + 90e3);   // 90 s after, so the API has the new shop
    timer = setTimeout(load, Math.min(wait, 2 ** 31 - 1));
  }

  function left(ms){
    ms = Math.max(0, ms);
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    if(d) return `${d}${T("u_d")} ${h}${T("u_h")}`;
    if(h) return `${h}${T("u_h")} ${m}${T("u_m")}`;
    return `${Math.max(1, m)}${T("u_m")}`;
  }

  function render(){
    const grid = $("#fs-grid"); if(!grid) return;
    const all = list();
    const kinds = ["all", ...KINDS, "other"].filter(k => k === "all" || all.some(p => p.kind === k));
    if(!kinds.includes(kind)) kind = "all";
    $("#fs-chips").innerHTML = state === "ok" ? kinds.map(k => {
      const n = k === "all" ? all.length : all.filter(p => p.kind === k).length;
      return `<button data-fskind="${k}" class="${k === kind ? "active" : ""}">${T("fs_" + k)} <small>${n}</small></button>`;
    }).join("") : "";
    if(state === "loading"){ grid.innerHTML = `<div class="empty fs-msg"><span class="spinner"></span>${T("fs_loading")}</div>`; return; }
    if(state === "error"){
      grid.innerHTML = `<div class="empty fs-msg">${T("fs_error")}<br><button class="btn ghost" data-fsretry style="margin-top:14px">${T("fs_retry")}</button></div>`;
      return;
    }
    const shown = all.filter(p => kind === "all" || p.kind === kind);
    grid.innerHTML = shown.map(cardHTML).join("");
    tick();
  }

  /* Every second: update countdowns; remove items that just left */
  function tick(){
    const resetEl = $("#fs-reset");
    if(resetEl) resetEl.textContent = left(nextReset() - now());
    let expired = false;
    $$("[data-left]").forEach(el => {
      const ms = +el.dataset.left - now();
      if(ms <= 0) expired = true;
      el.textContent = T("fs_leaves").replace("{t}", left(ms));
    });
    if(expired){
      render(); schedule();
      if(typeof catalogCat !== "undefined" && catalogCat === "fortnite") renderCatalog();
    }
  }

  function start(){
    if(!SETTINGS.fortniteShop.enabled){ const s = $("#fn-shop"); if(s) s.remove(); FN_SHOP.clear(); return; }
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-fskind],[data-fsretry]"); if(!b) return;
      if(b.dataset.fskind){ kind = b.dataset.fskind; render(); }
      else load();
    });
    setInterval(tick, 1000);
    render();
    load();
  }

  return { start, list, render, tick };
})();

</script>

/* Price formatting with currency conversion (rates in data.js) */
function fmt(iqd){
  if(currency === "IQD") return { num: iqd.toLocaleString("en-US"), unit: T("currency") };
  const v = iqd / SETTINGS.currencies[currency];
  return { num: (currency === "USD" ? "$" : "€") + v.toFixed(2), unit: "" };
}
const money = n => { const f = fmt(n); return `${f.num}${f.unit ? ` <i>${f.unit}</i>` : ""}`; };

};

}

  const deal = bestDeal(p);

}

/* ---------- Animated themed background per category ---------- */

  all:      ["controller","gift","coin","film","gem","crown","popcorn","headset","sparkle","phone"],

};
let currentTheme = null;
/* Floating icons for a category. strength: 1 = page background, 2 = bright banner */
function makeFloaters(cat, count, strength = 1){
  const icons = THEMES[cat] || THEMES.all;
  let out = "";
  for(let i = 0; i < count; i++){
    const r = (a,b) => a + Math.random() * (b - a);
    const depth = r(0, 1);                                   // 0 = far away, 1 = close
    const size = strength > 1 ? 26 + depth * 54 : 28 + depth * 70;
    const op = strength > 1 ? .25 + depth * .55 : .14 + depth * .28;
    out += `<span class="fl" style="left:${r(-4,96)}%;top:${r(-8,92)}%;
      --s:${Math.round(size)}px;--o:${op.toFixed(2)};--b:${((1 - depth) * 2.2).toFixed(1)}px;
      --dx:${Math.round(r(-60,60))}px;--dy:${Math.round(r(-70,-15))}px;--r:${Math.round(r(-45,45))}deg;
      --d:${r(7,15).toFixed(1)}s;--dl:-${r(0,15).toFixed(1)}s">${ic(icons[i % icons.length])}</span>`;
  }
  return out;
}
/* Icons falling from top to bottom, swaying and turning (page background) */
function makeRain(cat, count){
  const icons = THEMES[cat] || THEMES.all;
  let out = "";
  for(let i = 0; i < count; i++){
    const r = (a,b) => a + Math.random() * (b - a);
    const depth = r(0, 1);                                   // 0 = far (small, slow, blurry), 1 = near
    const dur = 26 - depth * 14;                             // near icons fall faster
    out += `<span class="rain" style="left:${((i + r(.1,.9)) / count * 100).toFixed(1)}%;--d:${dur.toFixed(1)}s;--dl:-${r(0,dur).toFixed(1)}s">
      <i style="--s:${Math.round(24 + depth * 46)}px;--o:${(.22 + depth * .45).toFixed(2)};--b:${((1 - depth) * 2).toFixed(1)}px;
        --x:${Math.round(r(18,50))}px;--r:${Math.round(r(25,70))}deg;--sw:${r(3,6).toFixed(1)}s">${ic(icons[i % icons.length])}</i></span>`;
  }
  return out;
}
function setTheme(cat){
  if(cat === currentTheme) return;
  currentTheme = cat;
  const holder = $("#theme-bg"); if(!holder) return;
  const c = CATEGORIES[cat] || CATEGORIES.all;
  const layer = document.createElement("div");
  layer.className = "theme-layer";
  layer.style.setProperty("--tc", c.color);
  layer.innerHTML = `<div class="theme-glow"></div><div class="theme-emblem">${ic(c.icon)}</div>${makeRain(cat, innerWidth < 720 ? 22 : 34)}`;
  holder.appendChild(layer);
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add("in")));
  [...holder.children].slice(0, -1).forEach(old => { old.classList.remove("in"); setTimeout(() => old.remove(), 900); });
}

/* Big animated banner at the top of "All products" for the chosen category */
function renderCatHero(){
  const el = $("#cat-hero"); if(!el) return;
  const c = CATEGORIES[catalogCat] || CATEGORIES.all;
  const n = withShop(catalogCat).filter(p => catalogCat === "all" || p.cat === catalogCat).length;
  el.style.setProperty("--tc", c.color);
  el.innerHTML = `
    <div class="ch-scene">${makeFloaters(catalogCat, innerWidth < 720 ? 10 : 16, 2)}</div>
    <div class="ch-orb"><span class="ch-ring"></span><span class="ch-ring r2"></span>${ic(c.icon)}</div>
    <div class="ch-text">
      <span class="ch-count">${T("cat_count").replace("{n}", n)}</span>
      <h2>${catalogCat === "all" ? T("store_title") : L(c)}</h2>
      <p>${L(c.tag || {en:""})}</p>
    </div>`;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}
function selectCat(k){
  catalogCat = k; renderCats(); renderCatalog(); renderMenu(); renderCatHero();
  if(activeZone === "catalog" || !activeZone) setTheme(k);
}

/* Categories that have products (an empty category is hidden until you add products to it) */
const visibleCats = () => Object.entries(CATEGORIES).filter(([k]) => k === "all" || PRODUCTS.some(p => p.cat === k));

/* ---------- Header: categories ---------- */
function renderCats(){
  $("#cats").innerHTML = visibleCats().map(([k,c]) =>
    `<button data-cat="${k}" class="${k===catalogCat?"active":""}"><span class="dot" style="background:${c.color}"></span>${L(c)}</button>`
  ).join("");
}

/* ---------- Hero: featured spotlight ---------- */
let slideIndex = 0, slideTimer = null;
const heroItems = () => SETTINGS.heroProducts.map(byId).filter(Boolean);
function renderSpot(){
  const items = heroItems(); if(!items.length){ $("#spot").innerHTML = ""; return; }
  const p = items[slideIndex];
  const oi = spotOpt[p.id] ?? 0, o = p.options[oi];
  $("#spot").innerHTML = `
    <div class="spot-head">
      <h2>${ic("flame")}${T("spotlight")}</h2>
      <div class="arrows">
        <button class="arrow" data-spot="-1" aria-label="Previous"><span style="display:grid;transform:${isRTL()?"none":"scaleX(-1)"}">${ic("chevron")}</span></button>
        <button class="arrow" data-spot="1" aria-label="Next"><span style="display:grid;transform:${isRTL()?"scaleX(-1)":"none"}">${ic("chevron")}</span></button>
      </div>
    </div>
    <div class="spot-card ${p.image ? "has-img" : ""}" style="--art:${p.image ? p.bg : ART[p.art]}">
      <span class="spot-plat">${ic(CATEGORIES[p.cat].icon)}${p.platform}</span>
      ${p.image ? `<img class="spot-img" src="${p.image}" alt="">` : `<div class="spot-icon">${ic(p.icon)}</div><div class="spot-mark">${p.label}</div>`}
      <div class="spot-body">
        ${p.note ? `<span class="note-pill">${ic("star")}<span>${L(p.note)}</span></span>` : ""}
        <h1>${L(p.name)}</h1>
        <p>${L(p.desc)}</p>
        <div class="spot-opts">${p.options.map((op,i) =>
          `<button data-sopt="${i}" class="${i===oi?"active":""}"><bdi>${L(op.label)}</bdi></button>`).join("")}</div>
        <div class="spot-foot">
          <div class="price"><small>${T("price")}</small><b>${money(o.price)}</b></div>
          <div class="spot-btns">
            <button class="cart-sq" id="spot-add" aria-label="${T("add_cart")}">${ic("cart")}</button>
            <button class="btn" id="spot-buy">${ic("bolt")}${T("buy_now")}</button>
          </div>
        </div>
      </div>
    </div>
    <div class="thumbs">${items.map((it,i) =>
      `<button data-thumb="${i}" class="${i===slideIndex?"active":""}" aria-label="${L(it.name)}">${artHTML(it)}</button>`).join("")}</div>`;
}
function goSlide(i){
  const n = heroItems().length; if(!n) return;
  slideIndex = (i + n) % n; renderSpot();
  if(activeZone === "spot") applyZone();        // top slider changes the background too
}

/* ---------- Background follows the section in the middle of the screen ---------- */
let activeZone = null, zoneIO = null;
function resolveZone(z){
  if(z === "spot")    return (heroItems()[slideIndex] || {}).cat || "all";
  if(z === "catalog") return catalogCat;
  return CATEGORIES[z] ? z : "all";
}
function applyZone(){ setTheme(resolveZone(activeZone || "all")); }
function observeZones(){
  if(!("IntersectionObserver" in window)) return;
  zoneIO = zoneIO || new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ activeZone = e.target.dataset.zone; applyZone(); } });
  }, { rootMargin: "-48% 0px -48% 0px" });    // a thin line across the middle of the screen
  zoneIO.disconnect();
  $$("[data-zone]").forEach(el => zoneIO.observe(el));
}
function startSlider(){
  clearInterval(slideTimer);
  slideTimer = setInterval(() => goSlide(slideIndex + 1), 7000);
}

/* ---------- Side menu ---------- */
function renderMenu(){
  $("#m-nav").innerHTML = visibleCats().map(([k,c]) =>
    `<button data-cat="${k}" class="${k===catalogCat?"active":""}">${ic(c.icon)}<span>${L(c)}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.chevron}</svg></button>`
  ).join("");
  $$("[data-cur]").forEach(b => b.classList.toggle("active", b.dataset.cur === currency));
}

/* ---------- Sections ---------- */
function renderFlash(){ if(!$("#row-flash")) return;
  const deals = PRODUCTS.filter(bestDeal).sort((a,b) => bestDeal(b) - bestDeal(a));
  $("#row-flash").innerHTML = deals.map(cardHTML).join("");
}

function renderBest(){
  const top = [...PRODUCTS].sort((a,b) => b.sold - a.sold).slice(0,6);
  $("#best").innerHTML = top.map((p,i) => `
    <button class="best-item" data-open="${p.id}">
      <span class="rank">${i+1}</span>
      ${artHTML(p)}
      <div class="best-info"><b>${L(p.name)}</b><span>${p.platform} · ${p.sold.toLocaleString("en-US")} ${T("sold")}</span></div>
      <div class="price"><small>${T("from")}</small><b>${money(minPrice(p))}</b></div>
    </button>`).join("");
}

function renderCatRows(){
  $("#cat-rows").innerHTML = visibleCats().map(([k]) => k).filter(k => k !== "all").map(k => {
    const items = PRODUCTS.filter(p => p.cat === k);
    if(!items.length) return "";
    return `<section class="reveal in" data-zone="${k}">
      <div class="container">
        <div class="sec-head">
          <h2><span class="bar" style="background:${CATEGORIES[k].color}"></span>${L(CATEGORIES[k])}</h2>
          <div class="tools">
            <a href="#store" class="see-all" data-see="${k}">${T("see_all")}<span class="flip">${ic("chevron")}</span></a>
            <button class="arrow" data-scroll="${k}" data-dir="-1" aria-label="Previous"><span class="flip" style="transform:${isRTL()?"none":"scaleX(-1)"}">${ic("chevron")}</span></button>
            <button class="arrow" data-scroll="${k}" data-dir="1" aria-label="Next"><span style="display:grid;transform:${isRTL()?"scaleX(-1)":"none"}">${ic("chevron")}</span></button>
          </div>
        </div>
        <div class="row" id="row-${k}">${items.map(cardHTML).join("")}</div>
      </div>
    </section>`;
  }).join("");
}

function renderCatalog(){
  const ALL = { en:"All", ckb:"هەمووی", ar:"الكل" };
  $("#chips").innerHTML = visibleCats().map(([k,c]) =>
    `<button data-chip="${k}" class="${k===catalogCat?"active":""}">${L(k === "all" ? ALL : c)}</button>`).join("");
  let list = withShop(catalogCat).filter(p => catalogCat === "all" || p.cat === catalogCat);
  if(sortMode === "popular") list.sort((a,b) => b.sold - a.sold);
  if(sortMode === "low")     list.sort((a,b) => minPrice(a) - minPrice(b));
  if(sortMode === "high")    list.sort((a,b) => minPrice(b) - minPrice(a));
  $("#catalog").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">${T("no_results")}</div>`;
}

function renderFooter(){
  $("#foot-cats").innerHTML = visibleCats().filter(([k]) => k!=="all")
    .map(([k,c]) => `<li><a href="#store" data-see="${k}">${L(c)}</a></li>`).join("");
  $("#pay").innerHTML = SETTINGS.payments.map(p => `<span>${p}</span>`).join("");
  $("#socials").innerHTML = Object.entries(SETTINGS.socials).map(([k,url]) =>
    `<a href="${url}" target="_blank" rel="noopener">${ic(k)}${k[0].toUpperCase()+k.slice(1)}</a>`).join("");
  $("#foot-hours").textContent = L(SETTINGS.hours);
  $("#year").textContent = new Date().getFullYear();
  /* tap the year 5 times quickly to open the store manager (only you can log in) */
  $("#year").onclick = () => { const n = (+$("#year").dataset.n || 0) + 1; $("#year").dataset.n = n; clearTimeout(window._yt); window._yt = setTimeout(() => $("#year").dataset.n = 0, 1500); if(n >= 5) location.href = "admin.html"; };
  $("#stat-customers").textContent = SETTINGS.stats.customers;
  $("#stat-delivery").textContent = L(SETTINGS.stats.delivery);
}

/* ---------- Reviews summary (footer) ---------- */
let rvList = [];
const STAR_FILL = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/></svg>';
function renderReviewSummary(){
  const st = ReviewStore.stats(rvList);
  $("#sum-stars").innerHTML = `<div class="stars">${[1,2,3,4,5].map(i =>
    `<span class="sb" style="--f:${Math.max(0, Math.min(1, st.avg - (i-1))) * 100}%">${STAR_FILL}</span>`).join("")}</div>`;
  $("#sum-avg").textContent = st.count ? `${st.avg.toFixed(1)} / 5.0` : "";
  $("#sum-based").textContent = st.count ? T("rv_based").replace("{n}", st.count) : T("rv_none");
}

/* ---------- Flash-deal countdown (resets every midnight) ---------- */
function tick(){ if(!$("#countdown")) return;
  const now = new Date(), end = new Date(now);
  end.setHours(24,0,0,0);
  let s = Math.max(0, Math.floor((end - now) / 1000));
  const h = String(Math.floor(s/3600)).padStart(2,"0");
  const m = String(Math.floor(s%3600/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  $("#countdown").innerHTML = `<span>${h}</span><span>${m}</span><span>${sec}</span>`;
}

/* ---------- Search ---------- */
function runSearch(q, box = $("#search-results")){
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("open"); return; }
  const hits = withShop("all-search").filter(p =>
    [p.name.en, p.name.ckb, p.name.ar, p.label, p.platform, CATEGORIES[p.cat].en].join(" ").toLowerCase().includes(q)
  ).slice(0,6);
  box.innerHTML = hits.length
    ? hits.map(p => `<button class="sr-item" data-open="${p.id}">${artHTML(p)}<div><b>${L(p.name)}</b><span>${T("from")} ${moneyPlain(minPrice(p))}</span></div></button>`).join("")
    : `<div class="sr-empty">${T("no_results")}</div>`;
  box.classList.add("open");
}

/* ---------- Product modal ---------- */
function openModal(id){
  const p = byId(id); if(!p) return;
  const cheapest = p.options.indexOf(p.options.reduce((a,b) => a.price <= b.price ? a : b));
  modalState = { id, opt: cheapest, qty: 1 };
  renderModal();
  $("#search-results").classList.remove("open");
  $("#menu").classList.remove("open");
  show("#modal");
}
function renderModal(){
  const p = byId(modalState.id), o = p.options[modalState.opt];
  $("#modal-inner").innerHTML = `
    ${artHTML(p)}
    <div>
      <span class="m-plat">${p.platform} · ${L(CATEGORIES[p.cat])}</span>
      <h3>${L(p.name)}</h3>
      ${p.note ? `<span class="note-pill">${ic("star")}<span>${L(p.note)}</span></span>` : ""}
      <p class="desc">${L(p.desc)}</p>
      <span class="label">${T("choose")}</span>
      <div class="options">
        ${p.options.map((op,i) => `<button class="opt ${i===modalState.opt?"active":""}" data-opt="${i}">
          <b><bdi>${L(op.label)}</bdi></b><span>${fmt(op.price).num}</span>${op.old ? `<s>${fmt(op.old).num}</s>` : ""}
        </button>`).join("")}
      </div>
      <div class="qty-row">
        <div><span class="label">${T("qty")}</span>
          <div class="stepper"><button data-mq="-1" aria-label="-">${ic("minus")}</button><span>${modalState.qty}</span><button data-mq="1" aria-label="+">${ic("plus")}</button></div>
        </div>
        <div style="text-align:end"><span class="label">${T("total")}</span><div class="m-total">${money(o.price * modalState.qty)}</div></div>
      </div>
      <div class="m-actions">
        <button class="btn ghost" id="m-add">${ic("cart")}${T("add_cart")}</button>
        <button class="btn" id="m-buy">${ic("bolt")}${T("buy_now")}</button>
      </div>
    </div>`;
}

/* ---------- Cart ---------- */
function addToCart(id, opt, qty){
  const line = cart.find(c => c.id === id && c.opt === opt);
  line ? line.qty += qty : cart.push({ id, opt, qty });
  saveCart(); renderCart();
  const c = $("#cart-count"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}
function saveCart(){ store.set("cart", cart); }
function cartTotal(){ return cart.reduce((s,c) => s + byId(c.id).options[c.opt].price * c.qty, 0); }

function renderCart(){
  cart = cart.filter(c => byId(c.id) && byId(c.id).options[c.opt] && !(byId(c.id).outDate < Date.now()));
  const count = cart.reduce((s,c) => s + c.qty, 0);
  $("#cart-count").textContent = count || "";
  if(!cart.length){
    $("#cart-items").innerHTML = `<div class="d-empty">${ic("cart")}<p>${T("cart_empty")}</p><button class="btn ghost" data-close>${T("keep")}</button></div>`;
    $("#cart-foot").style.display = "none";
    return;
  }
  $("#cart-foot").style.display = "";
  $("#cart-items").innerHTML = cart.map((c,i) => {
    const p = byId(c.id), o = p.options[c.opt];
    return `<div class="c-item">
      ${artHTML(p)}
      <div class="c-info"><b>${L(p.name)}</b><span><bdi>${L(o.label)}</bdi></span><span class="p">${moneyPlain(o.price * c.qty)}</span></div>
      <div class="stepper"><button data-cq="${i}" data-d="-1" aria-label="-">${c.qty===1?ic("trash"):ic("minus")}</button><span>${c.qty}</span><button data-cq="${i}" data-d="1" aria-label="+">${ic("plus")}</button></div>
    </div>`;
  }).join("");
  $("#cart-total").textContent = moneyPlain(cartTotal());
  updateCheckoutLink();
}
function updateCheckoutLink(){
  if(!cart.length) return;
  const lines = cart.map(c => {
    const p = byId(c.id), o = p.options[c.opt];
    return `• ${L(p.name)} — ${L(o.label)} × ${c.qty} = ${moneyPlain(o.price * c.qty)}`;
  });
  const note = $("#cart-note").value.trim();
  const msg = [T("msg_intro"), "", ...lines, "", `${T("total")}: ${moneyPlain(cartTotal())}`, note ? `${T("msg_note")}: ${note}` : ""].join("\n").trim();
  $("#checkout").href = `https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent(msg)}`;
}

/* ---------- Popups ---------- */
function show(sel){ $(sel).classList.add("open"); $("#overlay").classList.add("open"); document.body.classList.add("locked"); }
function hideAll(){ ["#modal","#about-modal","#drawer","#menu","#overlay"].forEach(s => $(s).classList.remove("open")); document.body.classList.remove("locked"); }
let toastTimer;
function toast(text){
  $("#toast-text").textContent = text;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 1800);
}

/* ---------- Language ---------- */
function setLanguage(l){
  lang = TEXT[l] ? l : "en";
  document.documentElement.lang = lang;
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";
  $$("[data-t]").forEach(el => el.innerHTML = T(el.dataset.t));
  $$("[data-ph]").forEach(el => el.placeholder = T(el.dataset.ph));
  $$("[data-lang]").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  store.set("lang", lang);
  renderAll();
  FnShop.render();
  observeReveal();
  observeZones();
}

function renderAll(){
  renderCats(); renderSpot(); renderMenu(); renderFlash(); renderBest(); renderCatRows(); renderCatalog(); renderFooter(); renderCart(); renderReviewSummary(); renderCatHero();
  if(modalState && $("#modal").classList.contains("open")) renderModal();
}

/* ---------- Scroll reveal ---------- */
let io;
function observeReveal(){
  if(!("IntersectionObserver" in window)){ $$(".reveal").forEach(e => e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.08 });
  $$(".reveal:not(.in)").forEach(e => io.observe(e));
}

/* ---------- Events (one listener handles all clicks) ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if(!t) {
    if(!e.target.closest("#search")) $("#search-results").classList.remove("open");
    return;
  }
  const d = t.dataset;

  if(d.lang) return setLanguage(d.lang);
  if(d.open){ e.preventDefault(); return openModal(d.open); }
  if(t.hasAttribute("data-close")) return hideAll();
  if(d.spot){ goSlide(slideIndex + +d.spot); return startSlider(); }
  if(d.thumb){ goSlide(+d.thumb); return startSlider(); }
  if(d.sopt){ spotOpt[heroItems()[slideIndex].id] = +d.sopt; renderSpot(); return startSlider(); }
  if(t.id === "spot-add" || t.id === "spot-buy"){
    const p = heroItems()[slideIndex];
    addToCart(p.id, spotOpt[p.id] ?? 0, 1);
    return t.id === "spot-buy" ? show("#drawer") : toast(T("added"));
  }
  if(d.cur){ currency = d.cur; store.set("cur", currency); return renderAll(); }
  if(t.id === "menu-btn") return show("#menu");

  if(d.cat){                       // category → filter "All products" and scroll there
    hideAll(); selectCat(d.cat);
    return $("#store").scrollIntoView({ behavior:"smooth" });
  }
  if(d.chip) return selectCat(d.chip);
  if(d.see) return selectCat(d.see);

  if(d.scroll){
    const row = $("#row-" + d.scroll);
    const step = row.clientWidth * 0.8 * (+d.dir) * (isRTL() ? -1 : 1);
    return row.scrollBy({ left: step, behavior:"smooth" });
  }

  if(d.opt !== undefined){ modalState.opt = +d.opt; return renderModal(); }
  if(d.mq){ modalState.qty = Math.max(1, Math.min(20, modalState.qty + +d.mq)); return renderModal(); }
  if(t.id === "m-add"){ addToCart(modalState.id, modalState.opt, modalState.qty); hideAll(); return toast(T("added")); }
  if(t.id === "m-buy"){ addToCart(modalState.id, modalState.opt, modalState.qty); $("#modal").classList.remove("open"); return show("#drawer"); }

  if(d.cq !== undefined){
    const line = cart[+d.cq]; line.qty += +d.d;
    if(line.qty <= 0) cart.splice(+d.cq, 1);
    saveCart(); return renderCart();
  }
  if(t.id === "cart-btn") return show("#drawer");
});

$("#overlay").addEventListener("click", hideAll);
document.addEventListener("keydown", e => { if(e.key === "Escape") hideAll(); });
$("#search-input").addEventListener("input", e => runSearch(e.target.value));
$("#search-input").addEventListener("focus", e => e.target.value && runSearch(e.target.value));
$("#sort").addEventListener("change", e => { sortMode = e.target.value; renderCatalog(); });
$("#cart-note").addEventListener("input", updateCheckoutLink);
$("#about-btn").addEventListener("click", () => { $("#menu").classList.remove("open"); $("#about-hours").textContent = L(SETTINGS.hours); show("#about-modal"); });

/* ---------- Start ---------- */
$$("[data-icon]").forEach(el => {
  if(el.tagName === "SPAN") el.outerHTML = ic(el.dataset.icon);
  else el.innerHTML = ic(el.dataset.icon) + el.innerHTML;
});
cart = store.get("cart") || [];
if(SETTINGS.currencies[store.get("cur")]) currency = store.get("cur");
setLanguage(store.get("lang") || SETTINGS.defaultLanguage);
setTheme(catalogCat);
startSlider();
tick(); setInterval(tick, 1000);
ReviewStore.init().then(() => ReviewStore.list()).then(l => { rvList = l; renderReviewSummary(); })
  .catch(err => console.error("Reviews:", err));
FnShop.start();
/* Apply products/sections saved from the store manager (admin.html) */
Catalog.load().then(changed => {
  if(!changed) return;
  if(!CATEGORIES[catalogCat]) catalogCat = "all";
  slideIndex = 0; currentTheme = null;
  renderAll(); observeReveal(); observeZones(); setTheme(catalogCat);
}).catch(err => console.error("Catalog:", err));

</script>
</body>
